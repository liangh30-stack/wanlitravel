<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- El título y la descripción los reescribe React según el idioma (/es, /en, /zh).
         Estos son los que ven los rastreadores que no ejecutan JavaScript. -->
    <title>Wanli Travel — DMC Europa × China · Receptivo de lujo B2B</title>
    <meta name="description" content="Receptivo de lujo para profesionales del turismo. Operaciones bilingües, itinerarios a medida y ejecución impecable en todo el corredor Europa–China." />
    <meta name="keywords" content="DMC España, receptivo China, viajes B2B Europa China, operador receptivo, agencias de viajes, turoperadores" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wanli Travel" />
    <meta property="og:title" content="Wanli Travel — DMC Europa × China" />
    <meta property="og:description" content="Receptivo de lujo para profesionales del turismo. Operaciones bilingües entre Europa y China." />
    <meta property="og:image" content="/hero-spain-arrival.jpg" />
    <meta property="og:url" content="https://wanlitravel.com" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wanli Travel — DMC Europa × China" />
    <meta name="twitter:description" content="Receptivo de lujo para agencias y turoperadores entre Europa y China." />
    <meta name="twitter:image" content="/hero-spain-arrival.jpg" />

    <!-- Las tipografías se sirven desde este mismo dominio (/fonts): Google Fonts
         está bloqueado en China continental y allí está media clientela. -->
    <link rel="preload" as="image" href="/hero-spain-arrival.jpg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icono-32.png" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <meta name="theme-color" content="#10151B" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
