<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="gold-gradient-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C4944A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A95A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4944A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red-gradient-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B22234;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC2244;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Gold swoosh (left) -->
  <path d="M 100,80 C 120,40 150,30 170,50 C 180,60 175,75 165,72 C 155,69 158,55 170,50 C 185,42 210,35 240,55"
        fill="none" stroke="url(#gold-gradient-l)" stroke-width="5" stroke-linecap="round"/>
  <!-- Red swoosh (right) -->
  <path d="M 210,55 C 240,35 270,30 310,50 C 320,55 310,48 300,50"
        fill="none" stroke="url(#red-gradient-l)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- WANLI text -->
  <text x="200" y="130" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="36" font-weight="300" letter-spacing="12" fill="#FFFFFF">WANLI</text>
  <!-- Tagline -->
  <text x="200" y="158" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="400" font-style="italic" fill="rgba(255,255,255,0.7)">Bridging China and Europe</text>
</svg>
