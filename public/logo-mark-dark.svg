<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100">
  <defs>
    <linearGradient id="gd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C4944A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A95A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4944A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B22234;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC2244;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Gold swoosh -->
  <path d="M 50,40 C 65,18 85,12 100,25 C 107,31 104,40 98,38 C 92,36 94,28 100,25 C 110,19 130,14 150,28"
        fill="none" stroke="url(#gd)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Red swoosh -->
  <path d="M 130,28 C 150,15 170,12 200,25 C 207,28 200,24 195,25"
        fill="none" stroke="url(#rd)" stroke-width="3" stroke-linecap="round"/>
  <!-- WANLI text -->
  <text x="125" y="72" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="26" font-weight="300" letter-spacing="9" fill="#0F172A">WANLI</text>
</svg>
